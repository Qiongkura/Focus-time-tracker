name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # tracker/monitor.py 在非 Windows 平台会主动抛 RuntimeError（依赖 Win32 API），
    # 所以这里必须用 windows-latest，不能跑 ubuntu-latest
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: 语法检查
        run: python -m compileall -q tracker main.py launcher.py

      - name: 单元测试
        run: python -m pytest -q
