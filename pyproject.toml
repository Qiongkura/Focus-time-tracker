[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "focus-time-tracker"
version = "1.3.0"
description = "Windows 前台窗口使用时长统计与可视化（纯本地，不联网）"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "matplotlib>=3.5",
]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]

[project.optional-dependencies]
# 图标与 Logo 显示；缺失时自动回退为默认占位图标
icons = ["Pillow>=9"]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.gui-scripts]
# 打包/安装后可直接运行 focus-time-tracker
focus-time-tracker = "launcher:main"

[tool.setuptools]
packages = ["tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    # 中文注释与字符串较宽，行长交给 line-length 控制即可
    "E501",
    # 允许在函数默认值里调用（本项目未使用可变默认值）
    "B008",
]
